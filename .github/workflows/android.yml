name: 앱 빌드 (APK)

# main에 올리면 APK를 만들어 'latest' 릴리스에 올려요. 휴대폰에서 바로 받아 설치할 수 있어요.
# 다른 브랜치·PR에서는 테스트와 빌드만 하고, 결과 APK는 Actions 실행 화면의 아티팩트로 받을 수 있어요.
on:
  push:
    branches: ["**", "!data"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write   # latest 릴리스 갱신

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # 서명 키 (선택): 저장소 Settings → Secrets에 SIGNING_KEYSTORE_BASE64 등을 넣으면 그 키로 서명해요.
      # 없으면 저장소의 공용 키(signing/shared-debug.keystore)로 서명해요. 어느 쪽이든 매번 같은 키라 업데이트 설치가 돼요.
      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "비밀값의 서명 키를 써요"
          else
            echo "공용 서명 키를 써요"
          fi

      - name: 테스트 (앱)
        run: ./gradlew --no-daemon testDebugUnitTest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 테스트 (수집기)
        working-directory: collector-service
        run: |
          pip install -q -r requirements.txt pytest
          python -m pytest -q

      - name: APK 만들기
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/hotdeal-radar-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk out/hotdeal-radar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hotdeal-radar-apk
          path: out/hotdeal-radar-${{ github.run_number }}.apk
          retention-days: 30

      - name: latest 릴리스에 올리기 (main만)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="main 커밋 ${GITHUB_SHA::7} · 빌드 #${{ github.run_number }} · 버전 1.0.${{ github.run_number }}"
          # 'latest' 태그가 이번 커밋을 가리키도록 릴리스를 새로 만든다 (주소는 그대로)
          gh release delete latest --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create latest out/hotdeal-radar.apk --title "핫딜 레이더 (최신)" --notes "$NOTES" --target "$GITHUB_SHA" --latest
