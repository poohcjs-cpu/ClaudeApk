name: 핏키보드 빌드 (APK)

on:
  push:
    branches: [fitkey]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: 테스트
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: APK 만들기
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/fitkey-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: fitkey-apk
          path: out/fitkey-${{ github.run_number }}.apk
          retention-days: 30
