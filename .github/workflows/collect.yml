name: 핫딜 수집

# 30분마다 커뮤니티 핫딜을 모아 다나와 가격과 비교하고, 앱이 읽는 deals.json을 'data' 브랜치에 올려요.
# 앱 주소: https://raw.githubusercontent.com/poohcjs-cpu/ClaudeApk/data/deals.json
on:
  schedule:
    - cron: "22,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # data 브랜치에 결과 저장

concurrency:
  group: hotdeal-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: collector-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector-service/requirements.txt

      - run: pip install -r requirements.txt

      # 지난 기록(글 목록·제품·가격 기록)을 이어서 쓴다. 이 저장소에 아직 없으면 hotdeal-radar의 기록으로 시작한다.
      - name: 지난 수집 기록 가져오기
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch -q --depth=1 origin data
            git -C "$GITHUB_WORKSPACE" archive FETCH_HEAD data | tar -x
            echo "이전 기록을 이어서 써요"
          elif git fetch -q --depth=1 https://github.com/poohcjs-cpu/hotdeal-radar.git data 2>/dev/null; then
            git -C "$GITHUB_WORKSPACE" archive FETCH_HEAD data | tar -x
            echo "hotdeal-radar 기록으로 시작해요"
          else
            echo "첫 실행이에요"
          fi

      - name: 커뮤니티 글 수집과 쇼핑몰 가격 비교
        run: python -m collector.collect

      - name: 앱 데이터 만들기
        run: python -m collector.build

      - name: 결과 저장 (data 브랜치)
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d data ] || exit 0
          rm -rf data/debug
          dir="$RUNNER_TEMP/store"; rm -rf "$dir"; mkdir -p "$dir"
          cp -r data "$dir/"
          [ -f docs/data/deals.json ] && cp docs/data/deals.json "$dir/deals.json"
          cd "$dir"
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "수집 기록 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
